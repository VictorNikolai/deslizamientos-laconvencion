name: Sincronizar con Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Instalar Git LFS
        run: |
          git lfs install

      - name: Push a Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          USER_NAME="${HF_USERNAME:-VictorNikolai}"
          SPACE_NAME="${HF_SPACE_NAME:-deslizamientos-laconvencion}"
          git push --force "https://${USER_NAME}:${HF_TOKEN}@huggingface.co/spaces/${USER_NAME}/${SPACE_NAME}" main
